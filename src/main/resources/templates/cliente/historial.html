<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="shortcut icon" th:href="@{/img/favicon.png}" type="image/x-icon">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <title>Historial de compras - FORJAGYM</title>
</head>
<body>
<div th:replace="~{fragments/fragment_cliente :: header}"></div>

<main>
    <div class="container py-5">
        <p class="text-primary fs-2 fw-bold mb-0">HISTORIAL DE COMPRAS</p>
        <p class="fs-5 text-secondary">Revisa tus compras y descarga tus comprobantes.</p>

        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
        <div th:if="${exito}" class="alert alert-success" th:text="${exito}"></div>

        <div th:if="${#lists.isEmpty(compras)}" class="alert alert-info">
            No tienes compras registradas.
        </div>

        <div class="table-responsive" th:unless="${#lists.isEmpty(compras)}">
            <table class="table align-middle">
                <thead>
                <tr>
                    <th scope="col">Comprobante</th>
                    <th scope="col">Fecha</th>
                    <th scope="col">Planes</th>
                    <th scope="col">Total</th>
                    <th scope="col">Estado</th>
                    <th scope="col">Opciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="compra : ${compras}">
                    <td class="fw-bold text-secondary" th:text="|N° ${compra.id}|">N° 1</td>
                    <td th:text="${#temporals.format(compra.fecha, 'dd/MM/yyyy HH:mm')}">01/01/2026 10:00</td>
                    <td>
                        <span th:each="d, it : ${compra.detalles}">
                            <span th:text="${d.plan.nombre}">Plan</span><span th:unless="${it.last}">, </span>
                        </span>
                    </td>
                    <td>S/ <span th:text="${#numbers.formatDecimal(compra.total, 1, 'COMMA', 2, 'POINT')}">0.00</span></td>
                    <td>
                        <span class="badge"
                              th:classappend="${compra.estado.name() == 'PAGADA'} ? 'bg-success' : (${compra.estado.name() == 'PENDIENTE'} ? 'bg-warning text-dark' : 'bg-danger')"
                              th:text="${#strings.capitalize(#strings.toLowerCase(compra.estado.name()))}">Pagada</span>
                    </td>
                    <td>
                        <a class="btn btn-sm btn-outline-primary" th:href="@{/cliente/historial/{id}(id=${compra.id})}">
                            <i class="bi bi-eye"></i> Ver comprobante
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<div th:replace="~{fragments/fragment_cliente :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
