<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="shortcut icon" th:href="@{/img/favicon.png}" type="image/x-icon">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <title>Resumen de compra - FORJAGYM</title>
</head>
<body>
<div th:replace="~{fragments/fragment_cliente :: header}"></div>

<main>
    <div class="container py-5">
        <p class="fw-bold text-primary fs-2 mb-0">RESUMEN DE TU COMPRA</p>
        <p class="fs-5 text-secondary">Revisa tu plan antes de continuar al pago.</p>

        <div th:if="${plan == null}" class="alert alert-warning mt-4">
            Aún no has seleccionado un plan.
            <a th:href="@{/cliente/planes}" class="alert-link">Ver planes</a>
        </div>

        <div class="row mt-4" th:if="${plan != null}">
            <div class="col-lg-7 mb-4">
                <div class="card h-100">
                    <div class="card-header">
                        <p class="fs-4 fw-bold text-primary mb-0" th:text="${plan.nombre}">Plan</p>
                    </div>
                    <div class="card-body">
                        <p class="text-secondary mb-3">
                            Duración: <span th:text="${plan.duracionDias}">30</span> días
                        </p>
                        <ul class="list-unstyled text-secondary mb-0">
                            <li class="mb-1" th:each="b : ${plan.beneficios}">
                                <i class="bi bi-check-lg text-primary me-1"></i>
                                <span th:text="${b.descripcion}">Beneficio</span>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>

            <div class="col-lg-5 mb-4">
                <div class="card h-100">
                    <div class="card-header">
                        <p class="fs-5 fw-bold mb-0">Detalle del pago</p>
                    </div>
                    <div class="card-body">
                        <div class="d-flex justify-content-between fw-bold fs-5">
                            <span>Total</span>
                            <span class="text-primary">S/ <span
                                    th:text="${#numbers.formatDecimal(plan.precio, 1, 'COMMA', 2, 'POINT')}">0.00</span></span>
                        </div>
                        <div class="d-grid gap-2 mt-4">
                            <a th:href="@{/cliente/compra/pago}" class="btn btn-primary">Continuar al pago</a>
                            <a th:href="@{/cliente/planes}" class="btn btn-outline-secondary">Cambiar de plan</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/fragment_cliente :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
