<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="shortcut icon" th:href="@{/img/favicon.png}" type="image/x-icon">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <title>Comprobante - FORJAGYM</title>
</head>
<body>
<div th:replace="~{fragments/fragment_cliente :: header}"></div>

<main>
    <div class="container py-5">
        
        <div class="text-center mb-4" th:if="${nueva}">
            <i class="bi bi-check-circle-fill text-success" style="font-size: 4rem;"></i>
            <p class="fw-bold text-primary fs-2 mb-0">¡COMPRA REALIZADA!</p>
            <p class="fs-5 text-secondary mb-0">
                Gracias, <span th:text="${compra.cliente.nombre}">Cliente</span>. Tu plan ya está activo.
            </p>
        </div>

        <div class="row justify-content-center">
            <div class="col-lg-7">
                <div class="card">
                    <div class="card-header">
                        <p class="fs-5 fw-bold mb-0">
                            Comprobante <span class="text-primary" th:text="|N° ${compra.id}|">N° 1</span>
                        </p>
                    </div>
                    <div class="card-body">

                        <div class="d-flex justify-content-between mb-2">
                            <span class="text-secondary">Fecha de emisión</span>
                            <span th:text="${#temporals.format(compra.fecha, 'dd/MM/yyyy HH:mm')}">01/01/2026 10:00</span>
                        </div>
                        <div class="d-flex justify-content-between mb-2">
                            <span class="text-secondary">Cliente</span>
                            <span th:text="${compra.cliente.nombre + ' ' + compra.cliente.apellido}">Cliente</span>
                        </div>
                        <div class="d-flex justify-content-between mb-2">
                            <span class="text-secondary">DNI</span>
                            <span th:text="${compra.cliente.dni}">00000000</span>
                        </div>

                        <hr>
                        
                        <div class="mb-3" th:each="d : ${compra.detalles}">
                            <div class="d-flex justify-content-between">
                                <span class="fw-bold" th:text="${d.plan.nombre}">Plan</span>
                                <span>S/ <span th:text="${#numbers.formatDecimal(d.precioUnitario, 1, 'COMMA', 2, 'POINT')}">0.00</span></span>
                            </div>
                            <div class="text-secondary small">
                                Vigencia:
                                <span th:text="${#temporals.format(d.fechaInicio, 'dd/MM/yyyy')}">01/01/2026</span>
                                al
                                <span th:text="${#temporals.format(d.fechaFin, 'dd/MM/yyyy')}">31/01/2026</span>
                            </div>
                        </div>

                        <hr>

                        <div class="d-flex justify-content-between fw-bold fs-5">
                            <span>Total pagado</span>
                            <span class="text-primary">S/ <span th:text="${#numbers.formatDecimal(compra.total, 1, 'COMMA', 2, 'POINT')}">0.00</span></span>
                        </div>

                        <div class="d-grid gap-2 mt-4">
                            <a th:if="${nueva}" th:href="@{/cliente/inicio}" class="btn btn-primary">Ir al inicio</a>
                            <a th:unless="${nueva}" th:href="@{/cliente/historial}" class="btn btn-outline-secondary">Volver al historial</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/fragment_cliente :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
