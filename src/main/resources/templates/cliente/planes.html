<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="shortcut icon" th:href="@{/img/favicon.png}" type="image/x-icon">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <title>Planes - FORJAGYM</title>
</head>
<body>
<div th:replace="~{fragments/fragment_cliente :: header}"></div>

<main>
    <div class="container py-5">
        <p class="fw-bold text-primary fs-2 mb-0">PLANES DE ENTRENAMIENTO</p>
        <p class="fs-5 text-secondary">
            Elige el plan que mejor se adapte a tus objetivos.
            Sin matrícula, sin contratos forzosos, cancela cuando quieras.
        </p>

        <div th:if="${error}" class="alert alert-danger mt-3" th:text="${error}"></div>

        <div th:if="${#lists.isEmpty(planes)}" class="alert alert-info mt-3">
            Por ahora no hay planes disponibles.
        </div>

        <div class="row mt-4 g-4">
            <div class="col-md-4" th:each="plan : ${planes}">
                <div class="card h-100">

                    <div class="card-header text-center">
                        <div class="d-flex justify-content-center align-items-baseline">
                            <p class="fs-3 text-primary fw-bold mb-0">S/</p>
                            <p class="fs-1 text-primary fw-bold mb-0 ms-1"
                               th:text="${#numbers.formatDecimal(plan.precio, 1, 'COMMA', 2, 'POINT')}">80.00</p>
                        </div>
                        <p class="text-secondary mb-1" th:text="${plan.duracionDias} + ' días'">30 días</p>
                        <p class="fs-4 fw-bold text-primary mb-0" th:text="${plan.nombre}">Fuerza Total</p>
                    </div>

                    <div class="card-body d-flex flex-column">
                        <ul class="list-unstyled text-secondary mb-3">
                            <li class="mb-1" th:each="b : ${plan.beneficios}">
                                <i class="bi bi-check-lg text-primary me-1"></i>
                                <span th:text="${b.descripcion}">Beneficio</span>
                            </li>
                        </ul>
                        
                        <div th:if="${!#lists.isEmpty(plan.categorias)}" class="mb-3">
                            <button class="btn btn-sm btn-outline-primary w-100" type="button"
                                    data-bs-toggle="collapse"
                                    th:attr="data-bs-target=|#categorias-${plan.id}|">
                                <i class="bi bi-tags me-1"></i> Ver categorías
                            </button>
                            <div class="collapse mt-2" th:id="|categorias-${plan.id}|">
                                <ul class="list-group list-group-flush small">
                                    <li class="list-group-item px-0" th:each="c : ${plan.categorias}">
                                        <strong class="text-primary" th:text="${c.nombre}">Categoría</strong><br>
                                        <span class="text-secondary" th:text="${c.descripcion}">Descripción</span>
                                    </li>
                                </ul>
                            </div>
                        </div>

                        <form class="mt-auto text-center" th:action="@{/cliente/planes/seleccionar}" method="post">
                            <input type="hidden" name="idPlan" th:value="${plan.id}">
                            <button type="submit" class="btn btn-primary w-100">Elegir este plan</button>
                        </form>
                    </div>

                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/fragment_cliente :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
