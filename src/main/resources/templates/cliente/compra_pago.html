<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="shortcut icon" th:href="@{/img/favicon.png}" type="image/x-icon">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <title>Pago - FORJAGYM</title>
</head>
<body>
<div th:replace="~{fragments/fragment_cliente :: header}"></div>

<main>
    <div class="container py-5">
        <p class="fw-bold text-primary fs-2 mb-0">MÉTODO DE PAGO</p>
        <p class="fs-5 text-secondary">Ingresa los datos de tu tarjeta para completar la compra.</p>

        <div class="row mt-4">
            <div class="col-lg-7 mb-4">
                <div class="card">
                    <div class="card-body">
                        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

                        <form th:action="@{/cliente/compra/pago}" th:object="${pago}" method="post">
                            
                            <div class="mb-4" th:if="${!#lists.isEmpty(tarjetas)}">
                                <label for="idTarjeta" class="form-label fw-bold">Tarjeta</label>
                                <select id="idTarjeta" name="idTarjeta" class="form-select">
                                    <option value="">Usar una tarjeta nueva</option>
                                    <option th:each="t : ${tarjetas}" th:value="${t.id}"
                                            th:text="${t.tipoTarjeta} + ' terminada en ' + ${t.numeroEnmascarado}">
                                        VISA terminada en 1111
                                    </option>
                                </select>
                            </div>
                            
                            <div id="bloqueTarjetaNueva">
                                <div class="mb-3">
                                    <label for="titular" class="form-label">Nombre del titular</label>
                                    <input type="text" id="titular" class="form-control" th:field="*{titular}"
                                           placeholder="Como aparece en la tarjeta" maxlength="100">
                                    <div class="text-danger small" th:if="${#fields.hasErrors('titular')}" th:errors="*{titular}"></div>
                                </div>
                                <div class="mb-3">
                                    <label for="numeroTarjeta" class="form-label">Número de tarjeta</label>
                                    <input type="text" id="numeroTarjeta" class="form-control" th:field="*{numeroTarjeta}"
                                           maxlength="23" placeholder="0000 0000 0000 0000">
                                    <div class="text-danger small" th:if="${#fields.hasErrors('numeroTarjeta')}" th:errors="*{numeroTarjeta}"></div>
                                </div>
                                <div class="row">
                                    <div class="col-6 mb-3">
                                        <label for="vencimiento" class="form-label">Vencimiento</label>
                                        <input type="text" id="vencimiento" class="form-control" th:field="*{vencimiento}"
                                               maxlength="5" placeholder="MM/AA">
                                        <div class="text-danger small" th:if="${#fields.hasErrors('vencimiento')}" th:errors="*{vencimiento}"></div>
                                    </div>
                                    <div class="col-6 mb-3">
                                        <label for="cvv" class="form-label">CVV</label>
                                        <input type="password" id="cvv" class="form-control" th:field="*{cvv}"
                                               maxlength="4" autocomplete="off" placeholder="123">
                                        <div class="text-danger small" th:if="${#fields.hasErrors('cvv')}" th:errors="*{cvv}"></div>
                                    </div>
                                </div>
                            </div>

                            <div class="form-check mb-4">
                                <input type="checkbox" class="form-check-input" th:field="*{aceptaTerminos}">
                                <label class="form-check-label" for="aceptaTerminos">Acepto los términos y condiciones</label>
                                <div class="text-danger small" th:if="${#fields.hasErrors('aceptaTerminos')}">Debes aceptar los términos.</div>
                            </div>

                            <div class="d-flex gap-2">
                                <a th:href="@{/cliente/compra/resumen}" class="btn btn-outline-secondary">Volver</a>
                                <button type="submit" class="btn btn-primary flex-grow-1">
                                    Pagar S/ <span th:text="${#numbers.formatDecimal(plan.precio, 1, 'COMMA', 2, 'POINT')}">0.00</span>
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-lg-5 mb-4">
                <div class="card">
                    <div class="card-header">
                        <p class="fs-5 fw-bold mb-0">Tu plan</p>
                    </div>
                    <div class="card-body">
                        <p class="fs-5 fw-bold text-primary mb-1" th:text="${plan.nombre}">Plan</p>
                        <p class="text-secondary mb-0">
                            <span th:text="${plan.duracionDias}">30</span> días &middot;
                            S/ <span th:text="${#numbers.formatDecimal(plan.precio, 1, 'COMMA', 2, 'POINT')}">0.00</span>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/fragment_cliente :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const selector = document.getElementById('idTarjeta');
    const bloqueNueva = document.getElementById('bloqueTarjetaNueva');
    if (selector) {
        selector.addEventListener('change', function () {
            bloqueNueva.classList.toggle('d-none', selector.value !== '');
        });
    }
</script>
</body>
</html>
