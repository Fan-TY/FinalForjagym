<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="shortcut icon" th:href="@{/img/favicon.png}" type="image/x-icon">
  <link rel="stylesheet" th:href="@{/css/styles.css}">
  <title>Registrar cliente - Pago</title>
</head>
<body>

<header class="sticky-top">
  <div class="bg-body shadow-sm">
    <div th:replace="~{fragments/fragment_navbar :: navbar}"></div>
  </div>
</header>

<main class="container my-5">
  <h1 class="fs-2 text-danger fw-bold mb-0">Completar compra</h1>
  <p class="text-secondary fs-5">Registra la tarjeta del socio para cobrar el plan</p>

  <div class="row g-4">
    <div class="col-12 col-lg-8">
      <form th:action="@{/admin/clientes/registrar/pago}" th:object="${pago}" method="post">
        <div class="card text-secondary border shadow-sm">
          <div class="card-body">
            <h5 class="text-danger fw-bold">Datos de la tarjeta</h5>

            <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

            <div class="row g-3">
              <div class="col-12">
                <label for="titular" class="form-label">Titular</label>
                <input type="text" id="titular" class="form-control" th:field="*{titular}" placeholder="Como aparece en la tarjeta" maxlength="100" required>
                <div class="text-danger small" th:if="${#fields.hasErrors('titular')}" th:errors="*{titular}"></div>
              </div>
              <div class="col-12">
                <label for="numeroTarjeta" class="form-label">Número de tarjeta</label>
                <input type="text" id="numeroTarjeta" class="form-control" th:field="*{numeroTarjeta}" placeholder="0000 0000 0000 0000" maxlength="23" required>
                <div class="text-danger small" th:if="${#fields.hasErrors('numeroTarjeta')}" th:errors="*{numeroTarjeta}"></div>
              </div>
              <div class="col-6">
                <label for="vencimiento" class="form-label">Vencimiento</label>
                <input type="text" id="vencimiento" class="form-control" th:field="*{vencimiento}" placeholder="MM/AA" maxlength="5" required>
                <div class="text-danger small" th:if="${#fields.hasErrors('vencimiento')}" th:errors="*{vencimiento}"></div>
              </div>
              <div class="col-6">
                <label for="cvv" class="form-label">CVV</label>
                <input type="password" id="cvv" class="form-control" th:field="*{cvv}" placeholder="123" maxlength="4" autocomplete="off" required>
                <div class="text-danger small" th:if="${#fields.hasErrors('cvv')}" th:errors="*{cvv}"></div>
              </div>
            </div>

            <div class="form-check mt-4">
              <input type="checkbox" class="form-check-input" th:field="*{aceptaTerminos}">
              <label class="form-check-label" for="aceptaTerminos">El socio acepta los términos y condiciones</label>
              <div class="text-danger small" th:if="${#fields.hasErrors('aceptaTerminos')}">Debe aceptar los términos.</div>
            </div>
          </div>
        </div>

        <div class="mt-3 d-flex gap-2">
          <button class="btn btn-danger" type="submit">Pagar S/ <span th:text="${#numbers.formatDecimal(plan.precio, 1, 'COMMA', 2, 'POINT')}">0.00</span></button>
          <a class="btn btn-outline-danger" th:href="@{/admin/clientes/registrar/plan}">Volver</a>
        </div>
      </form>
    </div>

    <div class="col-12 col-lg-4">
      <div class="card border shadow-sm mb-4">
        <div class="card-body">
          <p class="text-secondary mb-1">Plan seleccionado</p>
          <p class="fs-5 fw-bold text-danger mb-1" th:text="${plan.nombre}">Fuerza Total</p>
          <p class="mb-0" th:text="|S/ ${#numbers.formatDecimal(plan.precio, 1, 'COMMA', 2, 'POINT')} · ${plan.duracionDias} días|">S/ 120.00</p>
        </div>
      </div>
      <div th:replace="~{fragments/fragment_pasos :: pasos(3)}"></div>
    </div>
  </div>
</main>

<div th:replace="~{fragments/fragment_footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
