<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="shortcut icon" th:href="@{/img/favicon.png}" type="image/x-icon">
  <link rel="stylesheet" th:href="@{/css/styles.css}">
  <title>Plan - Administración</title>
</head>
<body>

<header class="sticky-top">
  <div class="bg-body shadow-sm">
    <div th:replace="~{fragments/fragment_navbar :: navbar}"></div>
  </div>
</header>

<main>
  <div class="container py-4">

    <div class="text-center p-3 w-75 mx-auto mb-4 text-danger rounded-4 border border-danger border-2">
      <p class="mb-0 fs-2 fw-bold" th:text="${titulo}">CREAR PLAN</p>
      <p class="mb-0 fs-5">Completa los datos del plan de entrenamiento</p>
    </div>

    <div class="card w-75 mx-auto border-0 shadow-sm px-4 py-3 mb-4">
      <div class="card-body">
        <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

        <form th:action="${accion}" th:object="${plan}" method="post">
          <div class="row g-3">

            <div class="col-12 col-md-6">
              <label for="nombre" class="form-label">Nombre del plan</label>
              <input type="text" id="nombre" th:field="*{nombre}" class="form-control"
                     placeholder="Fuerza Total" maxlength="50" required>
              <div class="text-danger small" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
            </div>

            <div class="col-12 col-md-6">
              <label for="precio" class="form-label">Precio (S/)</label>
              <input type="number" id="precio" th:field="*{precio}" class="form-control"
                     placeholder="120.00" min="0.01" step="0.01" required>
              <div class="text-danger small" th:if="${#fields.hasErrors('precio')}" th:errors="*{precio}"></div>
            </div>

            <div class="col-12 col-md-6">
              <label for="duracionDias" class="form-label">Duración (días)</label>
              <input type="number" id="duracionDias" th:field="*{duracionDias}" class="form-control"
                     placeholder="30" min="1" max="365" required>
              <div class="form-text">Entre 1 y 365 días.</div>
              <div class="text-danger small" th:if="${#fields.hasErrors('duracionDias')}" th:errors="*{duracionDias}"></div>
            </div>

            <div class="col-12 col-md-6">
              <label for="estadoPlan" class="form-label">Estado del plan</label>
              <select id="estadoPlan" th:field="*{estadoPlan}" class="form-select">
                <option th:each="e : ${estados}" th:value="${e}"
                        th:text="${#strings.capitalize(e.name())}">Activo</option>
              </select>
            </div>

            <div class="col-12">
              <label for="beneficios" class="form-label">Beneficios del plan</label>
              <textarea id="beneficios" th:field="*{beneficios}" class="form-control" rows="6"
                        placeholder="Un beneficio por línea" required></textarea>
              <div class="form-text">Escribe un beneficio por línea (Enter para separar).</div>
              <div class="text-danger small" th:if="${#fields.hasErrors('beneficios')}" th:errors="*{beneficios}"></div>
            </div>

            <div class="col-12 d-flex gap-2">
              <button class="btn btn-danger text-white" type="submit">Guardar</button>
              <a class="btn btn-outline-danger" th:href="@{/admin/planes}">Cancelar</a>
            </div>
          </div>
        </form>
      </div>
    </div>

  </div>
</main>

<div th:replace="~{fragments/fragment_footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
