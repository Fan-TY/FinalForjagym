<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="shortcut icon" th:href="@{/img/favicon.png}" type="image/x-icon">
  <link rel="stylesheet" th:href="@{/css/styles.css}">
  <title>Historial de compras - Administración</title>
</head>
<body>

<header class="sticky-top">
  <div class="bg-body shadow-sm">
    <div th:replace="~{fragments/fragment_navbar :: navbar}"></div>
  </div>
</header>

<main>
  <div class="container py-4">
    <p class="mb-0 fs-2 text-danger fw-bold">HISTORIAL DE COMPRAS</p>
    <p class="text-secondary fs-5">Compras registradas de todos los socios</p>

    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

    <div class="card border-0 shadow-sm mt-3">
      <div class="table-responsive">
        <table class="table table-striped align-middle mb-0">
          <thead>
          <tr>
            <th scope="col">N°</th>
            <th scope="col">Cliente</th>
            <th scope="col">DNI</th>
            <th scope="col">Fecha</th>
            <th scope="col">Detalle</th>
            <th scope="col">Total</th>
            <th scope="col">Estado</th>
          </tr>
          </thead>
          <tbody>
          <tr th:if="${#lists.isEmpty(compras)}">
            <td colspan="7" class="text-center text-secondary py-4">Aún no hay compras registradas</td>
          </tr>
          <tr th:each="compra : ${compras}">
            <td th:text="${compra.id}">1</td>
            <td class="fw-bold text-secondary" th:text="${compra.cliente.nombre + ' ' + compra.cliente.apellido}">Juan Quispe</td>
            <td th:text="${compra.cliente.dni}">12345678</td>
            <td th:text="${#temporals.format(compra.fecha, 'dd/MM/yyyy HH:mm')}">01/01/2026 10:00</td>
            <td>
              <div th:each="d : ${compra.detalles}">
                <span th:text="${d.plan.nombre}">Plan</span>
                <span class="text-secondary small"
                      th:text="|(${#temporals.format(d.fechaInicio, 'dd/MM/yyyy')} - ${#temporals.format(d.fechaFin, 'dd/MM/yyyy')})|">(01/01 - 31/01)</span>
              </div>
            </td>
            <td>S/ <span th:text="${#numbers.formatDecimal(compra.total, 1, 'COMMA', 2, 'POINT')}">0.00</span></td>
            <td>
              <span class="badge"
                    th:classappend="${compra.estado.name() == 'PAGADA'} ? 'bg-success' : (${compra.estado.name() == 'PENDIENTE'} ? 'bg-warning text-dark' : 'bg-danger')"
                    th:text="${#strings.capitalize(#strings.toLowerCase(compra.estado.name()))}">Pagada</span>
            </td>
          </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</main>

<div th:replace="~{fragments/fragment_footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
