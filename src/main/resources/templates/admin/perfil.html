<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="shortcut icon" th:href="@{/img/favicon.png}" type="image/x-icon">
  <link rel="stylesheet" th:href="@{/css/styles.css}">
  <title>Perfil del administrador</title>
</head>
<body>

<header class="sticky-top">
  <div class="bg-body shadow-sm">
    <div th:replace="~{fragments/fragment_navbar :: navbar}"></div>
  </div>
</header>

<main class="container py-4">
  <p class="mb-0 fs-2 text-danger fw-bold">MI PERFIL</p>
  <p class="text-secondary fs-5">Datos de tu cuenta y tu horario de atención</p>

  <div class="row g-4">

    <div class="col-lg-5">
      <div class="card border-0 shadow-sm h-100">
        <div class="card-body text-secondary">
          <div class="d-flex align-items-center gap-3 mb-4">
            <div class="rounded-circle bg-danger text-white d-flex align-items-center justify-content-center fs-4"
                 style="height: 70px; width: 70px;"
                 th:text="${#strings.substring(admin.nombre,0,1) + #strings.substring(admin.apellido,0,1)}">AB</div>
            <div>
              <h5 class="text-danger fw-bold mb-0" th:text="${admin.nombre + ' ' + admin.apellido}">Rosa Medina</h5>
              <span class="badge bg-danger">Administrador</span>
            </div>
          </div>
          <p class="mb-1"><strong>Correo:</strong> <span th:text="${admin.correo}">admin@forjagym.com</span></p>
          <p class="mb-1"><strong>DNI:</strong> <span th:text="${admin.dni}">12345678</span></p>
          <p class="mb-0"><strong>Teléfono:</strong> <span th:text="${admin.telefono}">999 999 999</span></p>
        </div>
      </div>
    </div>

    <div class="col-lg-7">
      <div class="card border-0 shadow-sm h-100">
        <div class="card-body">
          <h5 class="text-danger fw-bold">Horario de atención</h5>

          <p class="text-secondary" th:if="${#lists.isEmpty(horarios)}">No tienes horarios asignados.</p>

          <table class="table table-striped mb-0" th:unless="${#lists.isEmpty(horarios)}">
            <thead>
            <tr>
              <th scope="col">Día</th>
              <th scope="col">Horario</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="h : ${horarios}">
              <td class="fw-bold text-secondary">
                <th:block th:switch="${h.diaSemana.name()}">
                  <span th:case="'MONDAY'">Lunes</span>
                  <span th:case="'TUESDAY'">Martes</span>
                  <span th:case="'WEDNESDAY'">Miércoles</span>
                  <span th:case="'THURSDAY'">Jueves</span>
                  <span th:case="'FRIDAY'">Viernes</span>
                  <span th:case="'SATURDAY'">Sábado</span>
                  <span th:case="'SUNDAY'">Domingo</span>
                </th:block>
              </td>
              <td th:text="|${#temporals.format(h.horaInicio, 'HH:mm')} - ${#temporals.format(h.horaFin, 'HH:mm')}|">08:00 - 14:00</td>
            </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

  </div>
</main>

<div th:replace="~{fragments/fragment_footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
