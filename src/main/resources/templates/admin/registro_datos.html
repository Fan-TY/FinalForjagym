<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="shortcut icon" th:href="@{/img/favicon.png}" type="image/x-icon">
  <link rel="stylesheet" th:href="@{/css/styles.css}">
  <title>Registrar cliente - Datos personales</title>
</head>
<body>

<header class="sticky-top">
  <div class="bg-body shadow-sm">
    <div th:replace="~{fragments/fragment_navbar :: navbar}"></div>
  </div>
</header>

<main class="container my-5">
  <h1 class="fs-2 text-danger fw-bold mb-0">Registrar cliente</h1>
  <p class="text-secondary fs-5">Completa los datos personales del socio</p>

  <div class="row g-4">
    <div class="col-12 col-lg-8">
      <form th:action="@{/admin/clientes/registrar/datos}" th:object="${registro}" method="post">
        <div class="card text-secondary border shadow-sm">
          <div class="card-body">
            <h5 class="text-danger fw-bold">Datos personales</h5>
            <p>Información básica del socio</p>

            <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

            <div class="row g-3">
              <div class="col-12 col-md-6">
                <label for="nombre" class="form-label">Nombre</label>
                <input type="text" id="nombre" class="form-control" placeholder="Juan" maxlength="50" th:field="*{nombre}" required>
                <div class="text-danger small" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
              </div>

              <div class="col-12 col-md-6">
                <label for="apellido" class="form-label">Apellido</label>
                <input type="text" id="apellido" class="form-control" placeholder="Quispe" maxlength="50" th:field="*{apellido}" required>
                <div class="text-danger small" th:if="${#fields.hasErrors('apellido')}" th:errors="*{apellido}"></div>
              </div>

              <div class="col-12 col-md-6">
                <label for="correo" class="form-label">Correo electrónico</label>
                <input type="email" id="correo" class="form-control" placeholder="cliente@gmail.com" maxlength="50" th:field="*{correo}" required>
                <div class="text-danger small" th:if="${#fields.hasErrors('correo')}" th:errors="*{correo}"></div>
              </div>

              <div class="col-12 col-md-6">
                <label for="telefono" class="form-label">Teléfono</label>
                <input type="tel" id="telefono" class="form-control" placeholder="999 999 999" maxlength="50" th:field="*{telefono}" required>
                <div class="text-danger small" th:if="${#fields.hasErrors('telefono')}" th:errors="*{telefono}"></div>
              </div>

              <div class="col-12 col-md-6">
                <label for="dni" class="form-label">DNI</label>
                <input type="text" id="dni" class="form-control" placeholder="12345678" maxlength="8" th:field="*{dni}" required>
                <div class="text-danger small" th:if="${#fields.hasErrors('dni')}" th:errors="*{dni}"></div>
              </div>

              <div class="col-12 col-md-6">
                <label for="fechaNacimiento" class="form-label">Fecha de nacimiento</label>
                <input type="date" id="fechaNacimiento" class="form-control" th:field="*{fechaNacimiento}" required>
                <div class="text-danger small" th:if="${#fields.hasErrors('fechaNacimiento')}" th:errors="*{fechaNacimiento}"></div>
              </div>

              <div class="col-12">
                <label for="contactoEmergencia" class="form-label">Contacto de emergencia</label>
                <input type="tel" id="contactoEmergencia" class="form-control" placeholder="999 999 999" maxlength="50" th:field="*{contactoEmergencia}" required>
                <div class="text-danger small" th:if="${#fields.hasErrors('contactoEmergencia')}" th:errors="*{contactoEmergencia}"></div>
              </div>
            </div>
          </div>
        </div>

        <div class="mt-3 d-flex gap-2">
          <button class="btn btn-danger" type="submit">Continuar</button>
          <a class="btn btn-outline-danger" th:href="@{/admin/clientes/registrar/cancelar}">Cancelar</a>
        </div>
      </form>
    </div>

    <div class="col-12 col-lg-4 align-self-center">
      <div th:replace="~{fragments/fragment_pasos :: pasos(1)}"></div>
    </div>
  </div>
</main>

<div th:replace="~{fragments/fragment_footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
