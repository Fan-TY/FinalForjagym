<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="shortcut icon" th:href="@{/img/favicon.png}" type="image/x-icon">
  <link rel="stylesheet" th:href="@{/css/styles.css}">
  <title>Registrar cliente - Plan</title>
</head>
<body>

<header class="sticky-top">
  <div class="bg-body shadow-sm">
    <div th:replace="~{fragments/fragment_navbar :: navbar}"></div>
  </div>
</header>

<main class="container my-5">
  <h1 class="fs-2 text-danger fw-bold mb-0">Selección de plan de entrenamiento</h1>
  <p class="text-secondary fs-5">Compara las opciones y asigna la que mejor se adapte al socio</p>

  <div class="row g-4">
    <div class="col-12 col-lg-8">
      <form th:action="@{/admin/clientes/registrar/plan}" method="post">
        <div class="card text-secondary border shadow-sm">
          <div class="card-body">
            <h5 class="text-danger fw-bold">Plan de entrenamiento</h5>
            <p>Elige el plan con el que se registrará este socio.</p>

            <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
            <div class="alert alert-warning" th:if="${#lists.isEmpty(planes)}">
              No hay planes activos. Activa uno desde Planes.
            </div>

            <div class="row row-cols-1 row-cols-md-3 g-3">
              <div class="col" th:each="p : ${planes}">
                <div class="card h-100" th:classappend="${seleccionado != null and p.id == seleccionado} ? 'border-danger border-2'">
                  <div class="card-header text-center">
                    <div class="form-check d-inline-block">
                      <input class="form-check-input" type="radio" name="idPlan"
                             th:id="|plan-${p.id}|" th:value="${p.id}"
                             th:checked="${seleccionado != null and p.id == seleccionado}" required>
                      <label class="form-check-label fw-bold stretched-link" th:for="|plan-${p.id}|"
                             th:text="${p.nombre}">Fuerza Total</label>
                    </div>
                    <p class="mb-0 text-secondary"
                       th:text="|S/ ${#numbers.formatDecimal(p.precio, 1, 'COMMA', 2, 'POINT')} · ${p.duracionDias} días|">S/ 120.00 · 30 días</p>
                  </div>
                  <div class="card-body">
                    <ul class="list-unstyled mb-0">
                      <li class="mb-1" th:each="b : ${p.beneficios}">
                        <i class="bi bi-check-lg text-danger me-1"></i><span th:text="${b.descripcion}">Beneficio</span>
                      </li>
                    </ul>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="mt-3 d-flex gap-2">
          <button class="btn btn-danger" type="submit">Continuar</button>
          <a class="btn btn-outline-danger" th:href="@{/admin/clientes/registrar}">Volver</a>
        </div>
      </form>
    </div>

    <div class="col-12 col-lg-4 align-self-center">
      <div th:replace="~{fragments/fragment_pasos :: pasos(2)}"></div>
    </div>
  </div>
</main>

<div th:replace="~{fragments/fragment_footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
